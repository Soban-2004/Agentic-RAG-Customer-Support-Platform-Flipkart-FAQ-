services:
  qdrant:
    image: qdrant/qdrant:v1.16.1  # matches the qdrant-client version pinned in requirements.txt
    container_name: flipkart-faq-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
