# AI Gateway routing config.
#
# Every LLM call in the app goes through src/gateway/llm_gateway.py, which reads
# this file instead of any code talking to a provider SDK directly. To add a new
# provider (OpenAI, Anthropic, ...), add an entry here + its api_key_env var —
# LiteLLM handles the rest.

default_model: fast
timeout_seconds: 30
# Kept low deliberately: Groq's Llama models occasionally emit a malformed
# `<function=...>` tool-call that their own API then rejects (a model/provider
# quirk, not specific to one model size). Each retry AND the automatic
# fallback-to-the-other-model both re-send the full request, so a higher
# max_retries multiplies token usage on every transient failure -- which on a
# free-tier TPM budget causes more rate-limit errors than it fixes.
max_retries: 1

models:
  # Groq deprecated llama-3.3-70b-versatile AND llama-3.1-8b-instant (email
  # notice 2026-06-17, shut down 2026-08-16 -- console.groq.com/docs/
  # deprecations) -- both hard-404 now, "does not exist or you do not have
  # access to it". Every Settings.llm call (RAG-answer synthesis, intent
  # classification) was silently falling through this file's own fallback
  # chain for ~2 weeks before this was caught, undetected specifically
  # because classify_intent fails OPEN to a safe default on any error
  # rather than raising -- see src/eval/data/intent_cases.json, added
  # alongside this fix, for the regression guard.
  #
  # Replacements are Groq's own recommendation for each deprecated model
  # (same source as above): gpt-oss-120b for the 70b-class primary,
  # gpt-oss-20b for the 8b-class fallback -- both openai/gpt-oss, so they
  # share the same reasoning_effort semantics (low/medium/high; unlike
  # Qwen, gpt-oss 400s on "none" -- verified live). Unlike the old models,
  # both are reasoning models: without reasoning_effort tuned down and
  # reasoning_format=hidden, they either 400 (tool-calling with the "raw"
  # reasoning_format default) or silently burn the whole completion budget
  # on an internal trace and return empty content (verified live: happened
  # at max_tokens=20, fixed at reasoning_effort=low +
  # reasoning_format=hidden). See llm_gateway.py's build_gateway_llm for
  # where these two fields actually get applied.
  fast:
    model: groq/openai/gpt-oss-120b
    api_key_env: CHATGROQ_API_KEY
    temperature: 0.2
    max_tokens: 1024
    reasoning_effort: low

  # Fallback: smaller/faster model, used automatically if the primary errors/times out.
  fallback:
    model: groq/openai/gpt-oss-20b
    api_key_env: CHATGROQ_API_KEY
    temperature: 0.2
    max_tokens: 1024
    reasoning_effort: low

  # Used specifically for the agent's own tool-call decision step (see
  # src/agent/chat_agent.py's build_agent -- passed as its `llm`, NOT set as
  # Settings.llm), not for RAG-answer synthesis or intent classification.
  # Those two are plain text generation and were never the problem; the
  # actual failure mode was Groq occasionally emitting a malformed tool-call
  # that its own API rejects, which a bug in litellm's Groq-specific
  # streaming-error parser then turns into an ugly crash instead of a clean
  # error (`ValueError: invalid literal for int() with base 10:
  # 'tool_use_failed'`) -- see README's Agent + Planning section. Routing
  # tool-calling to a different provider sidesteps that crash surface
  # entirely. Served through a local Ollama daemon (`ollama pull
  # gemma4:cloud`, requires `ollama signin` once) that proxies to Ollama
  # Cloud -- no API key needed here, auth happens at the daemon level.
  tool_call:
    model: ollama_chat/gemma4:cloud
    api_base: http://localhost:11434
    temperature: 0.2
    max_tokens: 1024

  # Prompt-injection/jailbreak classifier for src/gateway/guardrails.py --
  # NOT routed through build_gateway_llm() like the other three (no fallback
  # apparatus needed for a single classification call, and it isn't
  # Settings.llm or the agent's llm). Meta's dedicated prompt-attack detector,
  # not a general-purpose model repurposed for it -- replaces LLM Guard's
  # local PromptInjection scanner, which cost ~450MB of RAM just from
  # importing the llm_guard library at all (torch + transformers pulled in
  # unconditionally by its base classes, verified by direct measurement).
  # This runs on Groq's infrastructure instead: zero local RAM, same API key
  # already used for everything else.
  prompt_guard:
    model: groq/meta-llama/llama-prompt-guard-2-86m
    api_key_env: CHATGROQ_API_KEY

  # Vision-capable model for the damage-claim photo attachment (see
  # src/gateway/vision.py) -- NOT routed through build_gateway_llm(), same
  # reasoning as prompt_guard above: a single-purpose call, no fallback
  # apparatus needed, not Settings.llm or the agent's own llm. Llama 4 Scout
  # (17Bx16 MoE) is Groq's smaller/faster natively-multimodal model, vs.
  # Maverick (17Bx128E) -- plenty for describing a product-damage photo in a
  # couple of sentences, and this is a supplementary enrichment step ahead
  # of the real answer, not the answer itself, so cost/latency matters more
  # here than peak capability (console.groq.com/docs/vision).
  vision:
    model: groq/meta-llama/llama-4-scout-17b-16e-instruct
    api_key_env: CHATGROQ_API_KEY

# Only models validated for the same task may participate in fallbacks.
fallback_groups:
  fast: [fallback]
  fallback: [fast]
  tool_call: [fallback]
